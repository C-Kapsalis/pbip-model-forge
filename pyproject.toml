[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pbip-model-forge"
version = "1.2.0"
description = "Generate openable Power BI PBIP semantic models (with data loaded) from plain-dict specs, validated with tmdl-preflight."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Christoforos Kapsalis", email = "ch.kapsalis@outlook.com" }]
keywords = ["powerbi", "pbip", "tmdl", "semantic-model", "data-modeling"]

# NOTE: the Python standard library is all this package needs at runtime;
# there are no pip dependencies to build or check a model.
dependencies = []

[project.optional-dependencies]
# tmdl-preflight is a REQUIRED companion tool for validation. It is not bundled;
# install it from GitHub:
#   pip install git+https://github.com/C-Kapsalis/tmdl-preflight.git
# The skills run the `tmdl-preflight` console command as the final gate; see
# README "Requirements".
dev = ["pytest>=7"]

[dependency-groups]
# `uv run --group test pytest` also runs the tmdl-preflight integration tests
# (they skip when tmdl-preflight is not installed; it needs Python 3.10+).
test = [
    "pytest>=7",
    "tmdl-preflight @ https://github.com/C-Kapsalis/tmdl-preflight/archive/refs/tags/v1.2.0.zip ; python_version >= '3.10'",
]

[project.scripts]
# `pbip-forge check|build|rules`: the modeling-rule gate and builder CLI.
pbip-forge = "pbip_model_forge.cli:forge_main"
# Convenience CLI: `pbip-forge-template` rebuilds the seed template.
pbip-forge-template = "pbip_model_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
